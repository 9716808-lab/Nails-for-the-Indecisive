<body style="background-color: #FFFFE0;">

<div class="result-box;" id="Your Combination!;" style="background-color: #FFB6C1;">
    <h3 style="text-align: center; font-family: cursive; color: #453a67;">Your Color!: <span x-text= "getSmallestNailColor"></span> </h3>
    <h3 style="text-align: center; font-family: cursive; color: #453a67;">Your Polish!: <span x-text= "getSmallestPolishType"></span> </h3>
    <h3 style="text-align: center; font-family: cursive; color: #453a67;">Your Shape!: <span x-text= "getSmallestNailShape"></span> </h3>

   <script>
       //The script section contains the JavaScript logic
       document.addEventListener('alpine:init', () => {
           Alpine.data('webApp', () => ({
            //This list has the users options for colors
            nailColor: ["Pink", "Blue", "Green", "Orange", "Black", "Yellow", "Tan"],
            //This list has the polish types
            polishType: ["Standard", "Gel", "Matte", "Sheer", "Glitter", "Effect"],
            //This list has the nail shapes
            nailShapes: ["Almond", "Natural", "Oval", "Flare", "Square", "Coffin", "Mountain Peak", "Stiletto"],
           //Mr. Rozelle gave instructions on how to create a randomized output and Gemini clarified on how to do so with examples
            numbersForNailColors: [1, 6, 9, 3, 4, 10, 5],
            numbersForPolishTypes: [11, 19, 17, 20, 13, 16],
            numbersForNailShapes: [25, 22, 27, 21, 30, 23, 29, 26],

            choicesForNailColors: [],
            choicesForPolishTypes: [],
            choicesForNailShapes: [],

            
            //The checkbox would not be checked so we switched where the true and false values were at
            colorPink: false,
            colorBlue: false,
            colorGreen: false, 
            colorOrange: false,
            colorBlack: false,
            colorYellow: false,
            colorTan: false,
            
            polishStandard: false,
            polishGel: false,
            polishMatte: false,
            polishSheer: false,
            polishGlitter: false,
            polishEffect: false,

            shapeStiletto: false,
            shapeMountainPeek: false,
            shapeCoffin: false,
            shapeSquare: false,
            shapeFlare: false,
            shapeOval: false,
            shapeNatural: false,
            shapeAlmond: false,
//This checks if the colors has been checked or not
//Missing curlybrackets made it so the text wouldn't show, Mr. Rozelle helped me notice it was missing
            updatePink() {
            if (this.colorPink) {
            this.colorPink = true;
            } else {
            this.colorPink = false;
            }
          },
            updateBlue() {
            if (this.colorBlue) {
            this.colorBlue = true;
            } else {
            this.colorBlue = false;
            }
          },
            updateGreen() {
            if (this.colorGreen) {
            this.colorGreen = true;
            } else {
            this.colorGreen = false;
            }
          },
            updateOrange() {
            if (this.colorOrange) {
            this.colorOrange = true;
            } else {
            this.colorOrange = false;
            }
          },
            updateTan() {
            if (this.colorTan) {
            this.colorTan = true;
            } else {
            this.colorTan = false;
            }
          },
            updateBlack() {
            if (this.colorBlack) {
            this.colorBlack = true;
            } else {
            this.colorBlack = false;
            }
          },
            updateYellow() {
            if (this.colorYellow) {
            this.colorYellow = true;
            } else {
            this.colorYellow = false;
            }
          },
          
          
          updateStandard() {
            if (this.polishStandard) {
            this.polishStandard = true;
            } else {
            this.polishStandard = false;
            }
          },
          updateGel() {
            if (this.polishGel) {
            this.polishGel = true;
            } else {
            this.polishGel = false;
            }
          },
          updateMatte() {
            if (this.polishMatte) {
            this.polishMatte = true;
            } else {
            this.polishMatte = false;
            }
          },
          updateSheer() {
            if (this.polishSheer) {
            this.polishSheer = true;
            } else {
            this.polishSheer = false;
            }
          },
          updateGlitter() {
            if (this.polishGlitter) {
            this.polishGlitter = true;
            } else {
            this.polishGlitter = false;
            }
          },
          updateEffect() {
            if (this.polishEffect) {
            this.polishEffect = true;
            } else {
            this.polishEffect = false;
            }
          },

          
          updateAlmond() {
            if (this.shapeAlmond) {
            this.shapeAlmond = true;
            } else {
            this.shapeAlmond = false;
            }
          },
          updateNatural() {
            if (this.shapeNatural) {
            this.shapeNatural = true;
            } else {
            this.shapeNatural = false;
            }
          },
          updateOval() {
            if (this.shapeOval) {
            this.shapeOval = true;
            } else {
            this.shapeOval = false;
            }
          },
          updateFlare() {
            if (this.shapeFlare) {
            this.shapeFlare = true;
            } else {
            this.shapeFlare = false;
            }
          },
          updateSquare() {
            if (this.shapeSquare) {
            this.shapeSquare = true;
            } else {
            this.shapeSquare = false;
            }
          },
          updateCoffin() {
            if (this.shapeCoffin) {
            this.shapeCoffin = true;
            } else {
            this.shapeCoffin = false;
            }
          },
          updateMountainPeek() {
            if (this.shapeMountainPeek) {
            this.shapeMountainPeek = true;
            } else {
            this.shapeMountainPeek = false;
            }
          },
          updateStiletto() {
            if (this.shapeStiletto) {
            this.shapeStiletto = true;
            } else {
            this.shapeStiletto = false;
            }
          },

        //The code below looks at what the user has chosen then based on it's corresponing number it will output the lowest
        //the choices list was empty so there was nothing to check for choices
        //Had to make sure the varibles match it's place in the lise

              getSmallestNailColor() {
                let choicesColors = [];
                if (this.colorPink) choicesColors.push(0);
                if (this.colorBlue) choicesColors.push(1);
                if (this.colorGreen) choicesColors.push(2);
                if (this.colorOrange) choicesColors.push(3);
                if (this.colorTan) choicesColors.push(6);
                if (this.colorBlack) choicesColors.push(4);
                if (this.colorYellow) choicesColors.push(5);

                //putting a comma "," after the curlybracket this broke the code


                if (choicesColors.length === 0) {
                  return "Select a color";
                }

                const chosenColor = choicesColors.map(index => {
                  return{
                    colorIndex: index,
                    numberValueOfColor:this.numbersForNailColors[index]
                  };
                });

                const smallestColor = chosenColor.reduce((min, current) => {
                  return current.numberValueOfColor < min.numberValueOfColor ? current : min;
                });

                return this.nailColor[smallestColor.colorIndex];

              },

              getSmallestPolishType(){
                let choicesForPolish = [];
                if (this.polishStandard) choicesForPolish.push(0);
                if (this.polishGel) choicesForPolish.push(1);
                if (this.polishMatte) choicesForPolish.push(2);
                if (this.polishSheer) choicesForPolish.push(3);
                if (this.polishGlitter) choicesForPolish.push(4);
                if (this.polishEffect) choicesForPolish.push(5);

                if (choicesForPolish.length === 0){
                  return "Choose Your Polish Type";
                }

                const chosenPolish = choicesForPolish.map(index => {
                  return{
                    polishIndex: index,
                    numberValueOfPolish: this.numbersForPolishTypes[index]
                  };
                });

                const smallestPolish = chosenPolish.reduce((min, current) => {
                  return current.numberValueOfPolish < min.numberValueOfPolish ? current : min;
                });

                return this.polishType[smallestPolish.polishIndex];

              },

              getSmallestNailShape(){
                let choicesForShapes = [];
                if (this.shapeAlmond) choicesForShapes.push(0);
                if (this.shapeNatural) choicesForShapes.push(1);
                if (this.shapeOval) choicesForShapes.push(2);
                if (this.shapeFlare) choicesForShapes.push(3);
                if (this.shapeSquare) choicesForShapes.push(4);
                if (this.shapeCoffin) choicesForShapes.push(5);
                if (this.shapeMountainPeek) choicesForShapes.push(6);
                if (this.shapeStiletto) choicesForShapes.push(7);


                if (choicesForShapes.length === 0){
                  return "Choose a Nail Shape";
                }

                const chosenShape = choicesForShapes.map(index => {
                  return{
                    shapeIndex: index,
                    numberValueOfShape: this.numbersForNailShapes[index]
                  };
                });

                const smallestShape = chosenShape.reduce((min, current) => {
                  return current.numberValueOfShape < min.numberValueOfShape ? current : min;
                });

                return this.nailShapes[smallestShape.shapeIndex];

              },

           
           }));
       });
   </script>
